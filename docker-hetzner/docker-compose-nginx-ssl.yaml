services:
  nginx:
    image: nginx:latest
    container_name: vocabulary-nginx-ssl
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
     # mount cert folders into container
      - ./nginx-conf/ssl/auth:/etc/nginx/ssl/auth:ro
      - ./nginx-conf/ssl/api:/etc/nginx/ssl/api:ro
   
    restart: unless-stopped
