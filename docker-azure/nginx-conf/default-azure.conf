# Optional: tune buffers/timeouts if you see 502s on long requests
proxy_http_version 1.1;
proxy_buffering off;

# Pass client details to the apps (important for Keycloak & HTTPS behind proxy)
map $http_x_forwarded_proto $best_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
    listen 80;
    server_name 20.223.169.151;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
   listen 443 ssl;
   server_name 20.223.169.151;

       # Paths to your SSL certificate and key
   ssl_certificate     /etc/ssl/example.crt;
   ssl_certificate_key /etc/ssl/example.key;


  # --- Spring Boot API (/rest) ---
  location /rest/ {
    proxy_pass http://host.docker.internal:9090/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;     # <—
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_redirect off;
  }

  # --- Keycloak at / ---
  location / {
    proxy_pass http://host.docker.internal:18081/;  # KC internal :8080 or your mapped port
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;     # <—
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_redirect off;
  }

  # Basic health check
  location = /health {
    return 200 "OK\n";
    add_header Content-Type text/plain;
  }
}