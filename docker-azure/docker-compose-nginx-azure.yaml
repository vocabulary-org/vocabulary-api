services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"       # only HTTP for now
      # later you’ll add:
      # - "443:443"
    volumes:
      - ./nginx-conf/default-azure.conf:/etc/nginx/conf.d/default.conf:ro
        # later you can mount certs here, e.g.:
      # - ./certs:/etc/ssl:ro
