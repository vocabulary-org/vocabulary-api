services:
  keycloak:
    environment:
        # Core
        KC_HTTP_ENABLED: "true"                 # Keycloak listens on 8080 internally
        KC_HOSTNAME: "keycloak.local"           # public host
        # Trust proxy headers from Nginx (replacement for old KC_PROXY=edge)
        KC_PROXY_HEADERS: "xforwarded"
        # (Optional but often helpful) force absolute URLs if needed
        KC_FRONTEND_URL: "https://keycloak.local"
        KC_LOG_LEVEL: INFO

