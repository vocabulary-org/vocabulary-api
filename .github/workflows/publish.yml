# Builds the Spring Boot jar and publishes it to GitHub Packages (Maven registry).
#
# Versions published (base = pom version without -SNAPSHOT, e.g. 0.0.1):
#   push to dev        -> <base>-SNAPSHOT
#   push of tag v1.2.3 -> 1.2.3
#   pull request #42   -> <base>-pr-42-SNAPSHOT

name: Publish jar

on:
  push:
    branches: [ "dev" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - name: Set version
      run: |
        BASE=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
        BASE=${BASE%-SNAPSHOT}
        case "$GITHUB_REF" in
          refs/tags/v*)  VERSION=${GITHUB_REF_NAME#v} ;;
          refs/pull/*)   VERSION=${BASE}-pr-${{ github.event.pull_request.number }}-SNAPSHOT ;;
          *)             VERSION=${BASE}-SNAPSHOT ;;
        esac
        echo "Publishing version $VERSION"
        mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

    - name: Build and publish jar
      run: mvn -B deploy --file pom.xml
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
