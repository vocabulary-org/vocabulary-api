# Builds the Spring Boot image (Cloud Native Buildpacks) and publishes it to GitHub Packages (ghcr.io).
#
# Tags pushed:
#   push to main     -> latest, sha-<short sha>
#   push of tag v1.2.3 -> 1.2.3, 1.2, sha-<short sha>
#   pull request #42   -> pr-42, sha-<short sha>

name: Publish image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Compute image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=pr
          type=sha

    - name: Build image with Maven
      run: mvn -B spring-boot:build-image -Dspring-boot.build-image.imageName=vocabulary/vocabulary-api:ci --file pom.xml

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag and push image
      run: |
        while read -r tag; do
          [ -z "$tag" ] && continue
          docker tag vocabulary/vocabulary-api:ci "$tag"
          docker push "$tag"
        done <<< "${{ steps.meta.outputs.tags }}"
