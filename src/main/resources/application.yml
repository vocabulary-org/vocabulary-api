server:
  port: 9090
  forward-headers-strategy: framework

spring:
  application:
    name: Vocabulary API
  datasource:
    url: jdbc:postgresql://localhost:25432/vocabulary_api
    username: enrico
    password: enrico
  data:
    web:
      pageable:
        max-page-size: 2147483647

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${application.keycloak.url}/realms/vocabulary
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs


  # Database Flyway migrations
  flyway:
    locations: classpath:/db/migration
    schemas: vocabulary
application:
  spa:
    url: http://localhost:4200
  keycloak:
    url: http://localhost:18081
    client-id: 'vocabulary-rest-api'
    admin-client-id: 'vocabulary-api-admin'
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:changeme}
  keycloak-client-service:
    skip-email: false


  # CORS configuration
  cors:
    allowed-origins: ${application.spa.url}
  api:
    version: v1
    description: ${spring.application.name}
    base-path: /api/${application.api.version}/vocabulary
    admin-path: ${application.api.base-path}/admin
    user-path: ${application.api.base-path}/me
    public-path: ${application.api.base-path}/public

  translation:
    monthly-max-translations: 30000



token:
  converter:
    principal-attribute: preferred_username
    resource-id: vocabulary-api

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: ALWAYS

azure:
  translator:
    key: ${AZURE_TRANSLATOR_KEY}
    region: switzerlandnorth
    url: https://api.cognitive.microsofttranslator.com/translate

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: claude-haiku-4-5-20251001
  url: https://api.anthropic.com