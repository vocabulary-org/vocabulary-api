spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.local/realms/vocabulary
          jwk-set-uri: http://keycloak.local:18081/realms/vocabulary/protocol/openid-connect/certs

  docker:
    compose:
      # load base + override when this profile is active
      file:
        - compose.yaml
        - compose-overrides/compose.nginx-ssl.yaml
application:
  spa:
    url: https://keycloak.local:4200

  cors:
    #allowed-origins: ${application.spa.url}
    allowed-origins: '*'


